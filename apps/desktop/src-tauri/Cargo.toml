[package]
name = "halo"
version = "0.1.0"
description = "Halo: focus timer, planner, blocker and trading-discipline desk"
authors = ["Seraph Labz"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
thiserror.workspace = true
chrono-tz.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
chrono.workspace = true
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono"] }
specta-typescript = "=0.0.15"
halo-store.workspace = true
halo-timer.workspace = true

[lints]
workspace = true
